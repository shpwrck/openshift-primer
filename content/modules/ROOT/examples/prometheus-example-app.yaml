---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-example-app
  namespace: default
  labels:
    app: prometheus-example-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-example-app
  template:
    metadata:
      labels:
        app: prometheus-example-app
    spec:
      containers:
        - name: prometheus-example-app
          image: ghcr.io/rhobs/prometheus-example-app:0.4.2
          ports:
            - name: web
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-example-app
  namespace: default
  labels:
    app: prometheus-example-app
spec:
  selector:
    app: prometheus-example-app
  ports:
    - name: web
      port: 8080
      targetPort: web
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: prometheus-example-app
  namespace: default
spec:
  selector:
    matchLabels:
      app: prometheus-example-app
  podMetricsEndpoints:
    - port: web
...
